name: W3C BAD Study Checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * 1"

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Ruff
        id: ruff
        continue-on-error: true
        run: python -m ruff check variables scripts

      - name: Robocop
        id: robocop
        continue-on-error: true
        run: python -m robocop check tests resources variables

      - name: Fail on lint errors
        if: steps.ruff.outcome == 'failure' || steps.robocop.outcome == 'failure'
        run: exit 1

  study:
    name: Robot And Axe
    runs-on: ubuntu-latest
    env:
      ENV: w3c
      HEADLESS: "true"
      BROWSER: chromium
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Install Node dependencies
        run: npm ci

      - name: Initialize Browser Library
        run: python -m Browser.entry init chromium

      - name: Install Playwright Chromium for axe-core
        run: npx playwright install chromium

      - name: Run all Robot suites
        id: robot
        if: github.event_name != 'schedule'
        continue-on-error: true
        run: python -m robot --outputdir results/robot tests

      - name: Run scheduled regression suite with Pabot
        id: regression
        if: github.event_name == 'schedule'
        continue-on-error: true
        run: >
          python -m pabot.pabot
          --command python -m robot --end-command
          --processes 4
          --outputdir results/regression
          --include regression
          tests

      - name: Run axe-core triage
        id: axe
        continue-on-error: true
        run: npm run a11y:axe

      - name: Upload generated evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w3c-bad-study-results
          path: results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Fail on study check errors
        if: >
          steps.robot.outcome == 'failure' ||
          steps.regression.outcome == 'failure' ||
          steps.axe.outcome == 'failure'
        run: exit 1
