name: W3C BAD Accessibility Study

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * 1-5"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint Python
        run: python -m ruff check variables scripts

      - name: Lint Robot Framework
        run: python -m robocop check tests resources variables

  tests:
    name: Robot And Axe Checks
    runs-on: ubuntu-latest
    needs: lint
    env:
      ENV: w3c
      HEADLESS: "true"
      BROWSER: chromium
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Install Node dependencies
        run: npm ci

      - name: Initialize Browser Library
        run: python -m Browser.entry init chromium

      - name: Install Playwright browser for axe
        run: npx playwright install chromium

      - name: Run W3C accessibility checks
        run: python -m robot --outputdir results/w3c --include accessibility tests/accessibility

      - name: Run axe-core checks
        run: npm run a11y:axe

      - name: Run regression on scheduled/main
        if: github.event_name == 'schedule' || github.ref == 'refs/heads/main'
        run: python -m pabot.pabot --command python -m robot --end-command --processes 4 --outputdir results/regression --include regression tests

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accessibility-results
          path: results/
          if-no-files-found: ignore
